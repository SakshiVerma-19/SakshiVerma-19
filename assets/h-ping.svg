<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 64" width="1000" height="64">
<title>PING_ME</title>
<defs><linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#00E5FF"/><stop offset="1" stop-color="#1E6FFF" stop-opacity=".2"/></linearGradient></defs>
<style>
  .a{animation:ja 5s infinite} .b{animation:jb 5s infinite}
  @keyframes ja{0%,92%,100%{transform:translate(-2px,0)}94%{transform:translate(-8px,1px)}97%{transform:translate(5px,0)}}
  @keyframes jb{0%,92%,100%{transform:translate(2px,0)}95%{transform:translate(8px,-1px)}98%{transform:translate(-5px,0)}}
  .bk{animation:bk 1s steps(1) infinite} @keyframes bk{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<path d="M4 14V4H16 M4 50V60H16" fill="none" stroke="#00E5FF" stroke-width="2"/>
<g font-family="'Courier New', Courier, 'SF Mono', Consolas, monospace" font-weight="700" font-size="32">
  <text class="a" x="44" y="45" textLength="133" lengthAdjust="spacing" fill="#1E6FFF">PING_ME</text>
  <text class="b" x="44" y="45" textLength="133" lengthAdjust="spacing" fill="#00E5FF" opacity=".85">PING_ME</text>
  <text x="44" y="45" textLength="133" lengthAdjust="spacing" fill="#EAF6FF">PING_ME</text>
</g>
<rect class="bk" x="183" y="20" width="10" height="28" fill="#00E5FF"/>
<text x="996" y="24" text-anchor="end" font-family="'Courier New', Courier, 'SF Mono', Consolas, monospace" font-size="12" fill="#9CC9FF">response time: faster than my sleep schedule recovers</text>
<line x1="207" y1="40" x2="996" y2="40" stroke="url(#ln)" stroke-width="2"/>
<g stroke="#00E5FF" stroke-opacity=".55"><line x1="239" y1="40" x2="239" y2="46"/><line x1="279" y1="40" x2="279" y2="50"/><line x1="319" y1="40" x2="319" y2="46"/><line x1="359" y1="40" x2="359" y2="50"/><line x1="399" y1="40" x2="399" y2="46"/><line x1="439" y1="40" x2="439" y2="50"/><line x1="479" y1="40" x2="479" y2="46"/><line x1="519" y1="40" x2="519" y2="50"/><line x1="559" y1="40" x2="559" y2="46"/><line x1="599" y1="40" x2="599" y2="50"/><line x1="639" y1="40" x2="639" y2="46"/><line x1="679" y1="40" x2="679" y2="50"/><line x1="719" y1="40" x2="719" y2="46"/><line x1="759" y1="40" x2="759" y2="50"/><line x1="799" y1="40" x2="799" y2="46"/><line x1="839" y1="40" x2="839" y2="50"/><line x1="879" y1="40" x2="879" y2="46"/><line x1="919" y1="40" x2="919" y2="50"/><line x1="959" y1="40" x2="959" y2="46"/></g>
<circle r="3.5" cy="40" fill="#fff"><animate attributeName="cx" values="207;996" dur="3.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="3.2s" repeatCount="indefinite"/></circle>
</svg>